[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dclabai"
version = "0.1.0.dev0"
description = "An agentic data-science studio: describe a problem, bring data, and get a leakage-safe model, its evaluation and its report, with your own model or none."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "The dclabai authors"}]
keywords = ["machine-learning", "agents", "data-science", "leakage", "automl", "llm", "ollama"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0,<4",  # tested on 2.x and 3.x (CI runs both)
    "scikit-learn>=1.5",
    "lightgbm>=4.4",
    "xgboost-cpu>=2.1; sys_platform != 'darwin'",  # the CPU build (no NVIDIA libraries); it has wheels for Linux and Windows only
    "xgboost>=2.1; sys_platform == 'darwin'",       # macOS: the regular wheel, which is CPU-only there
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.50",
    "jsonschema>=4.18",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.74"]
postgres = ["psycopg[binary]>=3.2"]
notebook = ["jupyter_client>=8.6", "ipykernel>=6.29"]
mcp = ["mcp>=1.20,<2"]
pdf = ["reportlab>=4.0"]
all = ["dclabai[anthropic,postgres,notebook,mcp,pdf]"]

[project.scripts]
dclab = "dclabai.open_cli:main"

[project.urls]
Documentation = "https://github.com/Shahriyar-Moradi/dclabai/tree/main/docs"
Source = "https://github.com/Shahriyar-Moradi/dclabai"
Issues = "https://github.com/Shahriyar-Moradi/dclabai/issues"

[tool.setuptools.packages.find]
include = ["dclabai*", "dclab_core*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.jsonl", "*.md", "*.html", "*.js", "*.css", "*.woff2", "*.txt", "*.mako", "*.ini", "*.svg", "*.png", "*.ipynb"]
