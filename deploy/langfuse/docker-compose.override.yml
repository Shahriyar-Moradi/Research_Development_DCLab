# DCLab Watch (2026-11-03): the official Langfuse Docker Compose (cloned into deploy/langfuse/upstream by `make langfuse-up`),
# changed only where this Mac needs it:
# - every port on 127.0.0.1 only (nothing reachable from the network);
# - Langfuse's own PostgreSQL on 5433, so it never meets DCLab's PostgreSQL 16 on 5432;
# - log rotation, so Docker's logs never fill the disk.
# Secrets come from deploy/langfuse/.env.langfuse (generated, git-ignored), never from this file.
x-logging: &logging
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  langfuse-web:
    <<: *logging
    ports: !override
      - "127.0.0.1:3000:3000"
  langfuse-worker:
    <<: *logging
    ports: !override
      - "127.0.0.1:3030:3030"
  postgres:
    <<: *logging
    ports: !override
      - "127.0.0.1:5433:5432"
  clickhouse:
    <<: *logging
    ports: !override
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
  minio:
    <<: *logging
    ports: !override
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
  redis:
    <<: *logging
    ports: !override
      - "127.0.0.1:6379:6379"
