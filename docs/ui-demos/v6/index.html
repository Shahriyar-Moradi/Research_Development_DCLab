<title>DCLab UI v6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the reference dashboard's style (a rounded app frame, a quiet sidebar with a profile on top, soft white cards,
   pill segmented tabs, green action buttons, a grey-framed table) applied to every DCLab page, on a warmer ground. */
:root{
  --page:#F3EEE7; --shell:#FBF9F6; --card:#FFFFFF; --soft:#F0EBE4; --soft-2:#E6E0D7; --hover:#F3EFE9;
  --fg:#1D1B18; --fg-2:#58524A; --muted:#8C857B; --line:#EBE5DD;
  --green:#55D163; --green-fg:#0D2911; --green-ink:#2C9638; --green-soft:#E5F6E5; --green-light:#A3E697;
  --red:#D6403A; --red-soft:#FCEAE7; --amber:#A8690F; --amber-soft:#FBEFD9; --blue:#2F5FC4; --blue-soft:#E7EEFA;
  --shadow:0 1px 2px rgb(70 50 25 / .04), 0 6px 18px -8px rgb(70 50 25 / .10);
  --sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#171512; --shell:#1D1B18; --card:#262320; --soft:#2E2A26; --soft-2:#3A3530; --hover:#2B2824;
  --fg:#F3EFE9; --fg-2:#CBC3B8; --muted:#8F877D; --line:#35302B;
  --green:#5BD769; --green-fg:#0B230F; --green-ink:#7FE08A; --green-soft:#1D3220; --green-light:#3F8F46;
  --red:#F0796D; --red-soft:#3B2321; --amber:#E6B65F; --amber-soft:#3A2E19; --blue:#93B2F2; --blue-soft:#1F2A3E;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 20px -10px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#171512; --shell:#1D1B18; --card:#262320; --soft:#2E2A26; --soft-2:#3A3530; --hover:#2B2824;
  --fg:#F3EFE9; --fg-2:#CBC3B8; --muted:#8F877D; --line:#35302B;
  --green:#5BD769; --green-fg:#0B230F; --green-ink:#7FE08A; --green-soft:#1D3220; --green-light:#3F8F46;
  --red:#F0796D; --red-soft:#3B2321; --amber:#E6B65F; --amber-soft:#3A2E19; --blue:#93B2F2; --blue-soft:#1F2A3E;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 20px -10px rgb(0 0 0 / .5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--fg);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green-ink);outline-offset:2px;border-radius:10px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-size:.9em}
.num{font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 40px);
  background:var(--shell);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.side{display:flex;flex-direction:column;gap:4px;padding:26px 18px;border-right:1px solid var(--line);min-width:0}
.profile{display:flex;align-items:center;gap:14px;padding:4px 10px 22px}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 30%,#FFE2B8,#F2A65A 55%,#C9733A)}
.profile b{display:block;font-weight:500;font-size:17px}
.profile small{display:block;color:var(--fg-2);font-size:14.5px}
.nav{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;color:var(--fg);font-size:16.5px;text-decoration:none}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--soft);font-weight:500}
.nav .ic{color:var(--fg-2)}
.nav .badge{margin-left:auto}
.side .grow{flex:1}
.shell.collapsed{grid-template-columns:0 minmax(0,1fr)}
.shell.collapsed .side{visibility:hidden;padding:0;overflow:hidden}

.main{min-width:0;padding:22px 32px 40px;display:flex;flex-direction:column;gap:24px}
.head{display:flex;align-items:center;gap:14px;min-height:52px}
.head h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;text-wrap:balance}
.head .sub{display:block;font-size:14.5px;font-weight:400;color:var(--fg-2);letter-spacing:0}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none}
.round:hover{background:var(--soft-2)}
.round.ghost{background:transparent}
.round.ghost:hover{background:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;background:var(--soft);font-weight:500;font-size:16px;white-space:nowrap}
.btn:hover{background:var(--soft-2)}
.btn.green{background:var(--green);color:var(--green-fg)}
.btn.green:hover{filter:brightness(1.05)}
.btn.sm{height:40px;padding:0 15px;font-size:15.5px;border-radius:13px}
.btn .ic{width:19px;height:19px}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .fill{flex:1}
.seg{display:inline-flex;gap:2px;padding:5px;border-radius:16px;background:var(--soft);max-width:100%;overflow-x:auto}
.seg button{padding:8px 20px;border-radius:12px;color:var(--fg-2);font-size:16px;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.select{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:var(--soft);font-size:16px;white-space:nowrap}
.select .chev{width:16px;height:16px}

/* ---------- cards ---------- */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 360px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px 24px;min-width:0}
.stat .lbl{color:var(--fg-2);font-size:16px}
.stat .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat .val{font-size:31px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.up,.chip.ok{background:var(--green-soft);color:var(--green-ink)}
.chip.down,.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.info{background:var(--blue-soft);color:var(--blue)}
.chip.mute{background:var(--soft);color:var(--fg-2)}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:14px;background:var(--green-soft);color:var(--green-ink)}
.ctitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctitle h2{margin:0;font-size:19px;font-weight:500;flex:1;min-width:0}
.legend{display:flex;gap:16px;color:var(--fg-2);font-size:15px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.minis{display:flex;flex-wrap:wrap;gap:12px 36px;margin:18px 0 6px}
.mini b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.mini .chip{background:none;padding:0 0 0 8px}
.mini small{display:block;color:var(--fg-2);font-size:15px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:var(--fg-2);font:13px var(--sans)}
.chart .gl{stroke:var(--line);stroke-width:1}

/* ---------- table ---------- */
.thead{display:flex;align-items:center;gap:10px;margin-top:6px}
.thead h2{margin:0;font-size:21px;font-weight:600}
.count{padding:2px 10px;border-radius:999px;background:var(--soft);font-size:14.5px;font-weight:500}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:0;flex:0 1 320px}
.search input{border:0;outline:0;background:transparent;min-width:0;flex:1;font-size:16px}
.search input::placeholder{color:var(--muted)}
.tframe{background:var(--soft);border-radius:20px;padding:0 6px 6px;overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;min-width:720px}
.t th{text-align:left;font-weight:400;color:var(--fg-2);font-size:15px;padding:14px 18px;white-space:nowrap;position:relative}
.t th + th::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:1px;background:var(--soft-2)}
.t th.r,.t td.r{text-align:right}
.t td{background:var(--card);padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:16px}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr:first-child td:first-child{border-top-left-radius:16px}
.t tbody tr:first-child td:last-child{border-top-right-radius:16px}
.t tbody tr:last-child td:first-child{border-bottom-left-radius:16px}
.t tbody tr:last-child td:last-child{border-bottom-right-radius:16px}
.idc{display:inline-flex;align-items:center;gap:12px;font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.idc .ic{width:18px;height:18px;color:var(--fg-2)}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.pav{width:44px;height:44px;border-radius:50%;flex:none}
.who b{display:block;font-weight:500}
.who small{display:block;color:var(--fg-2);font-size:14.5px}
.acts{display:inline-flex;gap:8px}
.acts .round{width:42px;height:42px}
.acts .round.del{background:var(--red-soft);color:var(--red)}
.ibar{display:flex;align-items:center;gap:10px}
.ibar span{display:block;height:8px;border-radius:999px;background:var(--green)}
.ibar em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--fg-2);font-size:14.5px;min-width:36px}

/* ---------- chat ---------- */
.chatcard{display:flex;flex-direction:column;padding:0;min-height:620px}
.thread{flex:1;padding:24px 26px;display:flex;flex-direction:column;gap:20px}
.turn{display:flex;gap:14px;max-width:760px}
.turn.me{align-self:flex-end;flex-direction:row-reverse}
.turn .pav{width:38px;height:38px;display:grid;place-items:center;font-size:13px;font-weight:600}
.bubble{padding:14px 18px;border-radius:18px;background:var(--soft);min-width:0}
.turn.me .bubble{background:var(--green-soft)}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
.bubble .t{min-width:0}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.facts div{background:var(--card);border-radius:14px;padding:10px 14px}
.facts small{display:block;color:var(--fg-2);font-size:14px}
.facts b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.qcard{border:2px solid var(--green);background:var(--card)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opt{height:40px;padding:0 16px;border-radius:13px;background:var(--soft)}
.opt:hover{background:var(--soft-2)}
.opt[aria-pressed="true"]{background:var(--green);color:var(--green-fg)}
.saved{margin-top:10px;color:var(--green-ink);font-weight:500}
.composer{padding:16px 20px 20px;border-top:1px solid var(--line)}
.cbox{display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 16px;border-radius:16px;background:var(--soft)}
.cbox textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;resize:none;padding:10px 0;font-size:16px;min-height:44px}
.cbox textarea::placeholder{color:var(--muted)}
.note{margin:10px 2px 0;color:var(--muted);font-size:13.5px}

.steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px}
.steps li.now{background:var(--soft)}
.steps .n{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:600;background:var(--soft);color:var(--fg-2);font-variant-numeric:tabular-nums}
.steps li.done .n{background:var(--green-soft);color:var(--green-ink)}
.steps li.now .n{background:var(--green);color:var(--green-fg)}
.steps b{display:block;font-weight:500;font-size:15.5px}
.steps small{display:block;color:var(--fg-2);font-size:14px}
.lockbox{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--soft);font-size:14.5px;color:var(--fg-2)}
.lockbox b{display:block;color:var(--fg);font-weight:500;font-size:15.5px}
.prog{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:14px}
.prog span{display:block;height:100%;background:var(--green);border-radius:999px}

/* ---------- report, settings ---------- */
.prose{max-width:68ch}
.prose h3{margin:22px 0 6px;font-size:18px;font-weight:600}
.prose p{margin:0 0 10px;color:var(--fg-2)}
.locked{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--soft);color:var(--fg-2);margin-top:10px}
.srow{display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srow:last-child{border-bottom:0;padding-bottom:0}
.srow .txt{flex:1;min-width:220px}
.srow b{display:block;font-weight:500}
.srow small{display:block;color:var(--fg-2);font-size:14.5px}
.field{height:44px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:var(--card);min-width:0;width:260px;max-width:100%}
.toggle{width:52px;height:30px;border-radius:999px;background:var(--soft-2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .2)}
.toggle[aria-checked="true"]{background:var(--green)}
.toggle[aria-checked="true"]::after{left:25px}
.empty{padding:40px 20px;text-align:center;color:var(--fg-2)}
.empty b{display:block;color:var(--fg);font-size:18px;font-weight:600;margin-bottom:4px}

.menu-btn{display:none}
.demo-tag{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:5;
  padding:8px 14px;border-radius:999px;background:var(--fg);color:var(--page);font-size:13.5px;box-shadow:var(--shadow)}

@media (prefers-reduced-motion:no-preference){
  .nav,.seg button,.btn,.round,.opt,.toggle,.toggle::after{transition:background-color .15s,color .15s,left .18s,box-shadow .15s}
}
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-side{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  body{padding-block:0;padding-left:0;padding-right:0}
  .shell{grid-template-columns:minmax(0,1fr);border-radius:0;border:0;min-height:100vh}
  .side{display:none;border-right:0;border-bottom:1px solid var(--line);
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .shell.open .side{display:flex}
  .side .grow{display:none}
  .main{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .menu-btn{display:grid}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .g4{grid-template-columns:minmax(0,1fr)}
  .head h1{font-size:22px}
  .head .hide-sm,.bar .hide-sm{display:none}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .thread{padding:18px 14px}
  .composer{padding:12px 14px 14px}
  .search{flex:1 1 100%}
  .stat .val{font-size:27px}
}

/* ---------- v6 additions: page picker, agent cards, key-value rows, files, tools list, chat home ---------- */
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;margin:0 6px 14px;border-radius:14px;background:var(--green);color:var(--green-fg);font-weight:600;font-size:16px;text-decoration:none}
.newbtn:hover{filter:brightness(1.05)}
.slabel{font-size:14px;color:var(--muted);padding:16px 16px 4px}
.recent{display:block;padding:8px 16px;border-radius:12px;color:var(--fg-2);font-size:15px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent:hover{background:var(--hover);color:var(--fg)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--fg-2);font-size:15px;flex-wrap:wrap}
.crumb a{color:inherit;text-decoration:none}.crumb a:hover{color:var(--fg)}
.crumb b{color:var(--fg);font-weight:500}
.vpick{position:relative;display:inline-flex;align-items:center}
.vpick select{appearance:none;-webkit-appearance:none;height:46px;padding:0 44px 0 18px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:16.5px;font-weight:500;cursor:pointer;max-width:100%}
.vpick .ic{position:absolute;right:14px;width:18px;height:18px;pointer-events:none;color:var(--fg-2)}
.lede{margin:-14px 0 0;color:var(--fg-2);font-size:16px;max-width:70ch}
.acard h3{margin:0 0 10px;font-size:19px;font-weight:600}
.acard p{margin:0 0 14px;font-size:16px}
.acard .out{color:var(--fg-2);font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kv{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px;flex-wrap:wrap}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv > span:last-child{color:var(--fg-2);text-align:right}
.kv select{height:42px;padding:0 12px;border-radius:13px;border:1px solid var(--line);background:var(--card)}
.files{list-style:none;margin:8px 0 0;padding:0}
.files li{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.files li:last-child{border-bottom:0}
.files .name{flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .kind{color:var(--fg-2);font-size:15px}
.files a{color:inherit;text-decoration:none;display:contents}
.tlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.tlist a{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;color:var(--fg);text-decoration:none;font-size:16.5px}
.tlist a:hover{background:var(--soft)}
.tlist a small{display:block;color:var(--fg-2);font-size:14px}
.tlist a .ic:last-child{margin-left:auto;width:16px;height:16px;color:var(--muted)}
.tlist .txt{min-width:0}
.dag{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
.node{padding:10px 14px;border-radius:14px;background:var(--soft);font-size:15px}
.node small{display:block;color:var(--fg-2);font-size:13px;font-family:var(--mono)}
.node.done{background:var(--green-soft)}.node.now{background:var(--green);color:var(--green-fg)}.node.now small{color:var(--green-fg)}
.arrow{color:var(--muted)}
.cell{border-radius:16px;background:var(--soft);overflow:hidden;margin-top:14px}
.cell pre{margin:0;padding:14px 16px;font:14px/1.6 var(--mono);overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0}
.cell .outp{padding:12px 16px;font-size:14.5px;color:var(--fg-2)}
.cell .cbar{display:flex;align-items:center;gap:8px;padding:8px 10px 0 16px;color:var(--muted);font:13px var(--mono)}
.conf{width:100%;border-collapse:separate;border-spacing:6px;margin-top:6px}
.conf th{font-weight:400;color:var(--fg-2);font-size:14.5px;text-align:left;padding:4px 6px}
.conf td{background:var(--soft);border-radius:12px;padding:14px;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.conf td.hit{background:var(--green-soft);color:var(--green-ink)}
.home-hero{max-width:760px;margin:6vh auto 0;width:100%;display:flex;flex-direction:column;gap:18px}
.home-hero h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.015em;text-align:center;text-wrap:balance}

// ---------- charts ----------
function axes(W,H,L,R,T,B,ticks,y,fmt){var s='';ticks.forEach(function(t){s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text x="'+(L-10)+'" y="'+(y(t)+4)+'" text-anchor="end">'+fmt(t)+'</text>'});return s}
function barChart(vals,labels,ticks,fmt,opt){
  opt=opt||{};var W=600,H=250,L=44,R=10,T=14,B=34,lo=ticks[0],hi=ticks[ticks.length-1];
  var y=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||'Bar chart')+'">'+axes(W,H,L,R,T,B,ticks,y,fmt);
  var n=vals.length,slot=(W-L-R)/n,bw=Math.min(28,slot*.5);
  vals.forEach(function(v,i){var cx=L+slot*i+slot/2,top=y(v);
    s+='<rect x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+Math.max(y(lo)-top,0)+'" rx="'+(bw/2)+'" fill="'+(opt.hl===i?'var(--green-ink)':'var(--green)')+'"><title>'+esc(labels[i])+': '+fmt(v)+'</title></rect><text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+esc(labels[i])+'</text>'});
  return s+'</svg>';
}
function lineChart(series,labels,ticks,label,fmt){
  fmt=fmt||function(t){return t};var W=600,H=250,L=48,R=12,T=14,B=34,lo=ticks[0],hi=ticks[ticks.length-1];
  var y=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))};var x=function(i){return L+(W-L-R)*i/(labels.length-1)};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+axes(W,H,L,R,T,B,ticks,y,fmt);
  labels.forEach(function(l,i){if(l!=='')s+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+l+'</text>'});
  series.forEach(function(se){s+='<polyline fill="none" stroke="'+se.c+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"'+(se.dash?' stroke-dasharray="5 5"':'')+' points="'+se.v.map(function(v,i){return x(i)+','+y(v)}).join(' ')+'"/>'});
  return s+'</svg>';
}
function roc(){
  var W=600,H=300,L=48,R=16,T=14,B=40,pts=[];
  var X=function(v){return L+(W-L-R)*v},Y=function(v){return T+(H-T-B)*(1-v)};
  for(var i=0;i<=40;i++){var f=i/40;pts.push(X(f)+','+Y(Math.pow(f,0.32)))}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="ROC curve of gradient boosting, AUC 0.84">';
  [0,.5,1].forEach(function(t){s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text x="'+(L-10)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+t.toFixed(1)+'</text>'});
  s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(1)+'" y2="'+Y(1)+'" stroke="var(--muted)" stroke-dasharray="4 5"/>';
  s+='<polyline fill="none" stroke="var(--green-ink)" stroke-width="3" stroke-linejoin="round" points="'+pts.join(' ')+'"/>';
  s+='<text x="'+X(0)+'" y="'+(H-14)+'" text-anchor="middle">0</text><text x="'+X(1)+'" y="'+(H-14)+'" text-anchor="middle">1.0</text><text x="'+X(.5)+'" y="'+(H-14)+'" text-anchor="middle">False positive rate</text>';
  return s+'</svg>';
}

// ---------- nav + router ----------
var NAV=[['home','Home','home',['home']],['projects','Projects','folder',['projects','project']],['agent','Agent','agent',['agent']]];
var FOOT=[['tools','More tools','dots',['tools','compute','integrations','packs','admin']],['prefs','Settings','gear',['prefs']],['map','Help','help',['map']],['home','Log out','out',[]]];
var navEl=document.getElementById('nav'),footEl=document.getElementById('foot'),main=document.getElementById('main'),shell=document.getElementById('shell');
function navHtml(list,h){return list.map(function(n){var on=n[3].indexOf(h)>-1;return '<a class="nav'+(on?' on':'')+'" href="#'+n[0]+'"'+(on?' aria-current="page"':'')+'>'+ic(n[2])+n[1]+'</a>'}).join('')}
function render(){main.innerHTML=PAGES[main.dataset.page]();}
function route(){
  var h=(location.hash||'').slice(1); if(!PAGES[h]) h='home';
  navEl.innerHTML=navHtml(NAV,h); footEl.innerHTML=navHtml(FOOT,h);
  main.dataset.page=h; render(); shell.classList.remove('open'); window.scrollTo(0,0);
}
function go(h){ if(location.hash==='#'+h) route(); else location.hash=h; }
document.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-newchat]'))){state.fresh=true;if(location.hash==='#home'){e.preventDefault();route()}return}
  if((t=e.target.closest('[data-go]'))){go(t.dataset.go);return}
  if((t=e.target.closest('[data-go-proj]'))){var p=t.dataset.goProj.split('.');state.ptab=p[0];state.sub[p[0]]=p[1];if(location.hash==='#project'){e.preventDefault();route()}return}
  if((t=e.target.closest('[data-ptab-go]'))){state.ptab=t.dataset.ptabGo;e.preventDefault();render();return}
  if((t=e.target.closest('a.recent'))){state.fresh=false;if(location.hash==='#home'){e.preventDefault();route()}return}
  if(!main.contains(e.target))return;
  if((t=e.target.closest('[data-ptab]'))){state.ptab=t.dataset.ptab;render();return}
  if((t=e.target.closest('[data-tab]'))&&t.closest('.bar')){state[main.dataset.page]=t.dataset.tab;render();return}
  if((t=e.target.closest('[data-x]'))){t.parentNode.querySelectorAll('[data-x]').forEach(function(x){x.setAttribute('aria-selected',String(x===t))});return}
  if((t=e.target.closest('[data-menu]'))){shell.classList.toggle(window.innerWidth>900?'collapsed':'open');return}
  if((t=e.target.closest('.opt'))){t.parentNode.querySelectorAll('.opt').forEach(function(x){x.setAttribute('aria-pressed',String(x===t))});var s=document.getElementById('saved');if(s)s.hidden=false;return}
  if((t=e.target.closest('.toggle'))){t.setAttribute('aria-checked',String(t.getAttribute('aria-checked')!=='true'));return}
  if((t=e.target.closest('.seg:not([role]) button'))){t.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===t))})}
});
main.addEventListener('change',function(e){if(e.target.id==='vpick'){state.sub[state.ptab]=e.target.value;render()}});
window.addEventListener('hashchange',function(){ if(location.hash!=='#home') state.fresh=false; route(); });
route();
})();
</script>
