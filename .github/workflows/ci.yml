# The checks every push and pull request must pass (package 12.3): the same gate as `make check-all` on a laptop,
# against a PostgreSQL service container, then, on main, the product built and started with docker compose and the
# end-to-end flows run against it. No job uses a model key: the tests and the flows run with DCLAB_NO_LIVE_MODELS=1
# and an empty OPENAI_API_KEY, whatever the repository's secrets hold. A failing check blocks the merge once main is
# protected and these checks are required (Settings > Branches).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"   # the evidence gates nightly, as the earlier workflow did

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DCLAB_NO_LIVE_MODELS: "1"
  OPENAI_API_KEY: ""
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    name: rd-check, the suite on PostgreSQL, the end-to-end flows
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dclab
          POSTGRES_PASSWORD: dclab-ci-only
          POSTGRES_DB: dclab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dclab -d dclab_test" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DCLAB_TEST_DATABASE_URL: postgresql+psycopg://dclab:dclab-ci-only@localhost:5432/dclab_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the secrets scan reads every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: "Install dependencies (CPU-only PyTorch, no GPU libraries on a CI runner)"
        run: |
          python -m venv .venv
          .venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/base.txt
      - name: rd-check (record validation, generated files, the suite)
        run: make rd-check
      - name: The suite on PostgreSQL
        run: make test-pg
      - name: The product's end-to-end flows
        run: make product-e2e
      - name: No committed secret (tracked files and history)
        run: make scan-secrets

  containers:
    name: The product in containers (make up) passes the end-to-end flows
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the app, the worker and PostgreSQL (docker-compose.yml)
        run: docker compose up -d --build --wait
      - name: The end-to-end flows against the containers
        run: python3 scripts/product_e2e.py --base http://127.0.0.1:8765
      - name: The image holds no secret
        run: |
          docker create --name scan dclab:local
          mkdir -p /tmp/image && docker export scan | tar -x -C /tmp/image
          python3 scripts/scan_secrets.py --root /tmp/image/app
      - name: The containers' logs, when something failed
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
