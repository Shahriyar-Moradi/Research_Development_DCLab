<section class="view" id="view-evaluation" hidden>
  <header class="vh">
    <div class="vh-text">
      <div class="eyebrow" id="ev-eyebrow">Project · evaluation</div>
      <h1>Evaluation</h1>
      <p class="lede">How well the model works: precision, recall, F1 and the other measures, the confusion matrix, and the curves, on the held-back cases and on the validation folds.</p>
    </div>
    <div class="vh-actions">
      <a class="btn" href="#reliability">Reliability &amp; holdout</a>
    </div>
  </header>
  <div id="ev-box"></div>
</section>

<script>
DC.view('evaluation', {
  async enter(el) {
    const { $, esc } = DC;
    const box = $('#ev-box', el);
    let p = null;
    try { p = await DC.currentProject.get(); } catch (e) { p = null; }
    DC.markSample(!p);
    if (!p) {
      $('#ev-eyebrow', el).textContent = 'Sample · evaluation';
      DC.states.empty(box, 'No project is open, so there is no model to evaluate. Start one on Home; its evaluation appears here once its final stage has scored the held-back cases.', { href: '#home', action: 'Go to Home' });
      return;
    }
    $('#ev-eyebrow', el).textContent = `${p.name} · evaluation`;
    await DC.evaluation.mount(box, p);
  },
});
</script>
